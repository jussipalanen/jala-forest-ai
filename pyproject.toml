[project]
name = "jalaforest"
version = "0.3.0"
description = "Forest stand search demo: WFS import and Natura 2000 overlap analysis in PostGIS"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.0",
    "pyarrow>=17",
    "streamlit>=1.66.1",
    "folium>=0.20.0",
    "streamlit-folium>=0.27.4",
    "google-genai>=2.34.0",
    "pydantic>=2.14.3",
]

[dependency-groups]
# Import and PostGIS analysis (`jalaforest` CLI). Not needed by the map app,
# so the app image (Dockerfile) leaves this group out.
pipeline = [
    "requests>=2.32",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "psycopg[binary]>=3.2",
]
dev = [
    "axe-playwright-python>=0.1.8",
    "pytest>=8",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.3",
]

[tool.uv]
default-groups = ["pipeline", "dev"]

[project.scripts]
jalaforest = "jalaforest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jalaforest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["e2e: browser tests with Playwright against a running Streamlit server"]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
