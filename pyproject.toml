[project]
name = "jalaforest"
version = "0.1.0"
description = "Forest stand search demo: WFS import and Natura 2000 overlap analysis in PostGIS"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.0",
    "pyarrow>=17",
    "requests>=2.32",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
jalaforest = "jalaforest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jalaforest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
