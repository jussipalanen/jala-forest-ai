services:
  postgis:
    image: postgis/postgis:18-3.6
    container_name: jalaforest-postgis
    environment:
      POSTGRES_DB: jalaforest
      POSTGRES_USER: jalaforest
      POSTGRES_PASSWORD: jalaforest
    ports:
      - "${POSTGIS_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/docker and expect the
      # volume at /var/lib/postgresql. A new volume name, because PostgreSQL 17 data cannot be
      # opened by 18; recreate the data with ./dev run.
      - postgis18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jalaforest -d jalaforest"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Map app. Reads the GeoParquet export (./dev run) from the mounted data directory.
  app:
    build: .
    container_name: jalaforest-app
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8501"          # Caddy proxy port inside the container (Cloud Run sets its own)
    ports:
      - "${APP_PORT:-8501}:8501"
    volumes:
      - ./data/export:/app/data/export:ro

  # Database web UI for local development: http://localhost:5050 (no login, localhost only).
  # Preconfigured with the project database; the Geometry Viewer shows PostGIS geometries on a map.
  pgadmin:
    image: dpage/pgadmin4:9.19.0
    container_name: jalaforest-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com      # required by the image, unused in desktop mode
      PGADMIN_DEFAULT_PASSWORD: jalaforest
      PGADMIN_CONFIG_SERVER_MODE: "False"           # desktop mode: no pgAdmin login
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
    # pgAdmin reads the database password from a pgpass file that must be private (0600),
    # so it is written inside the container rather than bind-mounted from the host.
    entrypoint:
      - /bin/sh
      - -c
      - printf 'postgis:5432:*:jalaforest:jalaforest\n' > /var/lib/pgadmin/pgpass
        && chmod 600 /var/lib/pgadmin/pgpass && exec /entrypoint.sh
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgis:
        condition: service_healthy

volumes:
  postgis18-data:
  pgadmin-data:
