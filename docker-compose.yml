services:
  postgis:
    image: postgis/postgis:18-3.6
    container_name: jalaforest-postgis
    environment:
      POSTGRES_DB: jalaforest
      POSTGRES_USER: jalaforest
      POSTGRES_PASSWORD: jalaforest
    ports:
      - "${POSTGIS_PORT:-5433}:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jalaforest -d jalaforest"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Map app. Reads the GeoParquet export (./dev run) from the mounted data directory.
  app:
    build: .
    container_name: jalaforest-app
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8501"
    ports:
      - "${APP_PORT:-8501}:8501"
    volumes:
      - ./data/export:/app/data/export:ro

volumes:
  postgis-data:
