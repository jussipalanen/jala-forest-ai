name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: jalaforest
          POSTGRES_USER: jalaforest
          POSTGRES_PASSWORD: jalaforest
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jalaforest -d jalaforest"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run pytest -q -rs

  e2e:
    runs-on: ubuntu-latest
    env:
      # The Gemini test runs only when this repository secret is set; otherwise it is skipped.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m e2e -q -rs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # The real export is not in git; build the image with the small synthetic data set.
      - run: |
          mkdir -p data/export
          uv run --no-default-groups python -c "import sys; sys.path.insert(0, 'tests'); \
            from pathlib import Path; from synthetic import write_synthetic_stands; \
            write_synthetic_stands(Path('data/export/stand_natura_overlap.parquet'))"
      - run: docker build -t jalaforest-app:ci .
      - run: deploy/smoke-test.sh jalaforest-app:ci
